# System-wide defaults for the g2l4a bicycle tour planning solver.
# User requests will deep-merge with these values, overriding specific keys.

defaults:
  weather_constraints:
    max_avg_high_f: 90.0
    min_avg_low_f: 24.0

  daily_constraints:
    max_miles_per_day: 70.0
    max_climb_ft_per_day: 5000.0

  duration_constraints:
    max_total_days: null

  solver_constraints:
    max_total_cities: 50
    max_search_minutes: 10.0

  scoring:
    weights:
      weather: 0.45
      distance: 0.30
      hills: 0.25
    comfort:
      ideal_temp_f: 70.0
      temp_tolerance_f: 20.0

  routing_preferences:
    avoid_highways: true
    avoid_tolls: true
    allow_ferries: true
    allow_international_borders: true

  routing_provider:
    name: "mock"
    routing_engine_name: "mock"
    base_url: "http://localhost:8989"
    profile: "bike"
    timeout_seconds: 12.0
    purge_mock_cache: false

  weather_provider:
    name: "open_meteo"
    timeout_seconds: 8.0
    climate_model: "CMCC_CM2_VHR4"
    capital_monthly_normals_path: "data/state_capitals_monthly_normals.json"

  cache:
    db_path: ".g2l4a_cache.db"
    forecast_ttl_hours: 24
    climatology_ttl_days: 30
    concurrency_limit: 10

