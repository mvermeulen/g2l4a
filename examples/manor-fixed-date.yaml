scenario_name: Manor Fixed Date Example

start_city: Austin, Texas
completion_city: Elgin, Texas
start_date: "2026-05-30"

via_cities:
  - Manor, Texas

daily_constraints:
  max_miles_per_day: 60.0
  max_climb_ft_per_day: 5000.0

weather_constraints:
  max_avg_high_f: 90
  min_avg_low_f: 24

weather_provider:
  name: meteostat

routing_provider:
  name: graphhopper
  base_url: http://localhost:8989
  profile: bike
  timeout_seconds: 12.0
  purge_mock_cache: true

output:
  alternatives_count: 6
  gpx: true
