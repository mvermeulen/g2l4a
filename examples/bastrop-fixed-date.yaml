scenario_name: Oak Hill to Bastrop Example

start_city: Oak Hill, Austin, Texas
completion_city: Bastrop, Bastrop County, Texas
start_date: "2026-05-30"

daily_constraints:
  max_miles_per_day: 60.0
  max_climb_ft_per_day: 5000.0

weather_constraints:
  max_avg_high_f: 90
  min_avg_low_f: 24

weather_provider:
  name: meteostat

routing_provider:
  name: graphhopper
  base_url: http://localhost:8989
  profile: car
  timeout_seconds: 12.0
  purge_mock_cache: true

output:
  alternatives_count: 6
  gpx: true
  lodging_overlay:
    enabled: true
    radius_meters: 3000
    types: ["hotel", "motel", "guest_house", "hostel", "camp_site", "chalet"]
