scenario_name: Dixie Corridor Example (Fixed Date)

start_city: Austin, Texas
completion_city: Harrisburg, Pennsylvania
start_date: "2027-01-02"

via_cities:
  - Baton Rouge, Louisiana
  - Jackson, Mississippi
  - Montgomery, Alabama
  - Tallahassee, Florida
  - Atlanta, Georgia
  - Columbia, South Carolina
  - Raleigh, North Carolina
  - Richmond, Virginia
  - Washington, DC

weather_constraints:
  max_avg_high_f: 90
  min_avg_low_f: 24

weather_provider:
  name: meteostat

routing_provider:
  name: graphhopper
  base_url: http://localhost:8989
  profile: bike
  timeout_seconds: 12.0
  purge_mock_cache: true

output:
  alternatives_count: 6
  gpx: true
