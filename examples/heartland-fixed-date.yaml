scenario_name: Heartland Corridor Example (Fixed Date)

start_city: Austin, Texas
completion_city: Chicago, Illinois
start_date: "2027-04-09"

via_cities:
  - Oklahoma City, Oklahoma
  - Topeka, Kansas
  - Jefferson City, Missouri
  - Little Rock, Arkansas
  - Nashville, Tennessee
  - Frankfort, Kentucky
  - Charleston, West Virginia

weather_constraints:
  max_avg_high_f: 92
  min_avg_low_f: 24

daily_constraints:
  max_miles_per_day: 60.0
  max_climb_ft_per_day: 5000.0

weather_provider:
  name: meteostat

routing_provider:
  name: graphhopper
  base_url: http://localhost:8989
  profile: bike
  timeout_seconds: 12.0
  purge_mock_cache: true

output:
  alternatives_count: 6
