services:
  graphhopper:
    build:
      context: .
      dockerfile: docker/graphhopper/Dockerfile
    container_name: g2l4a-graphhopper
    ports:
      - "8989:8989"
    environment:
      GH_VERSION: "11.0"
      GH_CONFIG_FILE: "/opt/graphhopper/config.yml"
      GH_OSM_FILE: "/opt/graphhopper/map.osm.pbf"
      # Set this to a URL for first-time bootstrap if map.osm.pbf is not present in the volume.
      # Example (very large): https://download.geofabrik.de/north-america/us-latest.osm.pbf
      GH_OSM_URL: "${GH_OSM_URL:-}"
      GH_GRAPH_LOCATION: "/opt/graphhopper/graph-cache"
      JAVA_OPTS: "${GRAPHHOPPER_JAVA_OPTS:--Xms1g -Xmx4g}"
    volumes:
      - ./.graphhopper:/opt/graphhopper
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/info"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 2h
